plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Keep in sync with rootProject.name in settings.gradle and mod_id in
    // gradle.properties. The shipped jar is <archivesName>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests live in their own source set: they compile against main, and are
// deliberately NOT part of sourceSets.main - so none of it is packaged into the
// released jar. Declared before neoForge because the mods block below joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless test runner. NeoForge's patched server Main boots a
        // GameTestServer that runs every registered @GameTest and exits - no
        // window, no live instance. This is the only verification gate.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // The gametest source set joins the mod for the dev runs so
            // @GameTestHolder is discovered from FML's scan data. It is still
            // not in the jar - the jar only packages sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml at build time, so mod identity is edited in one place
// (gradle.properties) rather than duplicated in the toml.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            api_version            : api_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Feed the generated metadata in as a resource dir; passing the task provider
// wires the dependency so the toml is generated before resources are processed.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()

    // infinite-dungeon-api, from the org's GitHub Packages registry. Measured
    // status codes when resolution fails: 401 means no credentials reached the
    // registry, while 404 means credentials arrived but the coordinate or
    // version is wrong. CI injects PACKAGE_READ_TOKEN as GITHUB_TOKEN on the
    // Gradle steps; locally supply gpr.user / gpr.key in
    // ~/.gradle/gradle.properties.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/infinite-dungeon-api')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('PACKAGE_READ_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }

    // Third-party integration coordinates (section 13), pinned exactly:
    // Corpse (compile-side, optional and ModList-gated) and Dungeon Crawl
    // (dev runtime - the lane structure set references dungeoncrawl:dungeon,
    // so the gametest server must carry the mod for the reference to resolve,
    // exactly as a real server must). Nothing here ships or forces a load.
    maven {
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
    }

    // Balm (Waystones' required library) ships on Modrinth only - dev
    // classpath, never packaged.
    maven {
        name = 'ModrinthMaven'
        url = uri('https://api.modrinth.com/maven')
    }
}

// A dev-runs-only dependency bucket. The runs resolve
// configurations.runtimeClasspath; extending it from this bucket puts the
// entry on every dev run (and the gametest server, which folds in this
// configuration) while runtimeElements - and therefore the published POM -
// stays free of optional mods that consumers never need transitively.
configurations {
    devRuntime
}

dependencies {
    // infinite-dungeon-api is required in every context: the core consumes its
    // dimension profiles, services, and events, and neoforge.mods.toml declares
    // it required. It is never packaged - the API ships as its own mod - and
    // testImplementation puts it on the JUnit classpath. Dependencies resolve
    // through Maven, never local folders.
    compileOnly "org.bitwisemadness.infinitedungeonapi:infinite_dungeon_api:${api_version}"
    runtimeOnly "org.bitwisemadness.infinitedungeonapi:infinite_dungeon_api:${api_version}"
    testImplementation "org.bitwisemadness.infinitedungeonapi:infinite_dungeon_api:${api_version}"

    // Corpse integration (section 13's pinned coordinate): compile-side so the
    // entity type can be identified by class; never packaged, never required
    // by consumers. devRuntime puts the jar on the dev runs and the gametest
    // server, so the sweep's wiring is proven in CI against the real classes
    // and the ModList gate is exercised for real.
    compileOnly "curse.maven:corpse-316582:9188333"
    devRuntime "curse.maven:corpse-316582:9188333"

    // Dungeon Crawl (section 13's pinned coordinate, 2.3.17): required by
    // neoforge.mods.toml and present on every dev run and the gametest server
    // so the lane set's dungeoncrawl:dungeon reference resolves there the way
    // it must on a real server. devRuntime only - no Dungeon Crawl classes are
    // touched (the startup placement mirror-read is pure registry API), so
    // there is no compile-side entry and nothing ships.
    devRuntime "curse.maven:dungeon-crawl-324973:7887320"

    // Waystones (section 13's pinned coordinate, 21.1.46) with its required
    // library: compile-side because the layer-entrance feature references the
    // WaystonesAPI/MutableWaystone/WaystoneStyles classes; devRuntime so the
    // gametest server boots with them the way a real server must (balm
    // satisfies waystones' own [21.0.39,) floor). The toml declares waystones
    // required; the bucket keeps the published POM free of the jars.
    compileOnly "curse.maven:waystones-245755:8969751"
    // Balm reaches the compile classpath too: waystones' block-entity
    // hierarchy extends Balm's base classes.
    compileOnly "maven.modrinth:balm:21.0.66+neoforge-1.21.1"
    devRuntime "curse.maven:waystones-245755:8969751"
    devRuntime "maven.modrinth:balm:21.0.66+neoforge-1.21.1"
    // compile-side now that the sanctioned void-placement mixin (issue #174,
    // agents/REPO.md) targets Dungeon Crawl's Dungeon class and the gametest
    // asserts its behavior; still never packaged.
    compileOnly "curse.maven:dungeon-crawl-324973:7887320"

    // JUnit wiring for the pure-logic suites the later waves add.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.runtimeClasspath.extendsFrom(configurations.devRuntime)

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary, not the exit code: the GameTestServer prints
// "All N required tests passed :)" when every required test succeeds. Keep
// expectedTests in sync with the @GameTest methods in src/gametest.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 31
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/infinite-dungeon')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// Both tools gate in the `static` CI job: SpotBugs findings fail
// `spotbugsMain` and Spotless violations fail `spotlessCheck`. SpotBugs sits
// on the `check` graph, so `./gradlew build` fails on findings too; Spotless
// stays detached (`enforceCheck false`), keeping the junit job's build
// style-agnostic by design - the static check is the style gate, junit is
// not. The SpotBugs HTML report still uploads as the `spotbugs-report`
// artifact every run (the CI step uses if: always()).
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    // Shared EI_EXPOSE_REP/EI_EXPOSE_REP2 exclusions; scope rule in the file.
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
