org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# The infinite-dungeon-api release this module builds against. Referenced by
# build.gradle (compile, test, and runtime) and by neoforge.mods.toml, whose
# required version range is derived from it, so the two cannot drift. Bump the
# pin deliberately, never implicitly, and only once a release has published the
# artifact.
api_version=1.0.0-alpha.11

# Mod identity. Everything a rename touches lives in this block.
mod_id=infinite_dungeon
mod_name=Infinite Dungeon
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.34
mod_group_id=org.bitwisemadness.infinitedungeon
mod_authors=Bitwise Madness
mod_description=A dungeon dimension: descending floors and layers, magicule-tuned spawns and bosses, safe rooms, and loot that scales with depth.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
