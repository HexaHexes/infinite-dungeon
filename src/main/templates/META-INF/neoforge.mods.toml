# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# infinite-dungeon-api: the core consumes its dimension profiles, services,
# and events, so it is required rather than optional. The range is derived from
# api_version in gradle.properties, the same value build.gradle resolves.
[[dependencies.${mod_id}]]
modId = "infinite_dungeon_api"
type = "required"
versionRange = "[${api_version},)"
ordering = "BEFORE"
side = "BOTH"

# Dungeon Crawl: the dimension generates its dungeon structures - the lane set
# references dungeoncrawl:dungeon and the biome gate feeds it (section 3 of the
# plan: core and untoggleable). The range pins the version the mod was verified
# against; resolution is by mod id, so later 2.x builds satisfy it.
[[dependencies.${mod_id}]]
modId = "dungeoncrawl"
type = "required"
versionRange = "[2.3.17,)"
ordering = "AFTER"
side = "BOTH"
reason = "The dungeon dimension generates Dungeon Crawl's dungeon structures."

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it so it no-ops when the
# dependency is absent.
